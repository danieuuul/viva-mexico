<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ef6c39" />
    <title>Viva Mexico | Discover your next destination</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <audio
      id="background-music"
      src="background.mp3"
      preload="auto"
      autoplay
    ></audio>

    <div class="site-shell">
      <header class="topbar">
        <button
          class="brand"
          id="brand-button"
          type="button"
          aria-label="Return to the home page"
        >
          <span class="brand-mark">✦</span>
          <span>Viva Mexico</span>
        </button>
        <div class="topbar-actions">
          <span class="music-status" id="music-status">Ambient sound off</span>
          <button
            class="music-button"
            id="music-button"
            type="button"
            aria-label="Turn on background music"
          >
            ♪
          </button>
        </div>
      </header>

      <main>
        <section class="home-view" id="home-view">
          <div class="hero-layout">
            <div class="hero-copy">
              <p class="eyebrow">One journey, nine stories</p>
              <h1>Your next <em>yes</em> starts in Mexico.</h1>
              <p class="hero-description">
                Choose an experience and feel the sun, culture, and flavors that
                make every stop unforgettable.
              </p>
            </div>
            <div class="mexico-decor" aria-hidden="true">
              <img class="decor-flag" src="bandeira-mexico.jpg" alt="" />
              <img class="decor-katrina" src="katrina.jpg" alt="" />
              <span class="decor-sun">Explore!</span>
            </div>
          </div>

          <div
            class="attractions-grid"
            id="attractions-grid"
            aria-label="Available attractions"
          ></div>
        </section>

        <section class="detail-view" id="detail-view" hidden>
          <button class="back-button" id="back-button" type="button">
            <span aria-hidden="true">←</span> See all experiences
          </button>
          <div class="detail-heading">
            <p class="eyebrow" id="detail-kicker">A special stop</p>
            <h2 id="detail-title"></h2>
            <p class="detail-location" id="detail-location"></p>
          </div>
          <div class="detail-content">
            <div class="carousel" aria-label="Photo gallery">
              <div class="carousel-frame">
                <img
                  class="carousel-backdrop"
                  id="carousel-backdrop"
                  src=""
                  alt=""
                />
                <img id="carousel-image" src="" alt="" />
                <div class="carousel-shade"></div>
                <button
                  class="carousel-control previous"
                  id="previous-button"
                  type="button"
                  aria-label="Previous photo"
                >
                  ←
                </button>
                <button
                  class="carousel-control next"
                  id="next-button"
                  type="button"
                  aria-label="Next photo"
                >
                  →
                </button>
                <div class="carousel-meta">
                  <span id="slide-counter">01 / 04</span
                  ><span>swipe to discover</span>
                </div>
              </div>
              <div
                class="carousel-dots"
                id="carousel-dots"
                aria-label="Select a photo"
              ></div>
            </div>
            <div class="detail-description">
              <p class="eyebrow">A story to experience</p>
              <p id="detail-description-text"></p>
              <div class="detail-highlights">
                <p class="eyebrow">Key highlights</p>
                <ul id="detail-highlights"></ul>
              </div>
              <div class="did-you-know">
                <p class="eyebrow">Did you know?</p>
                <p id="detail-did-you-know-text"></p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
